name: Claude code review

on:
  workflow_call:

jobs:
  review:
    name: Claude code review
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      # Shared Doppler project holding the Claude Code OAuth token, used by
      # every caller repository.
      SHARED_PROJECT: webops-shared-prod
      # Dedicated config: the fetch action exports every secret in the config,
      # so reusing deploy-configs would put VERCEL_TOKEN on the review runner
      # and the OAuth token on deploy runners.
      REVIEW_CONFIG: claude-review
      # Single service-account identity, trusted for every caller repository in
      # the org; read access on the review config only.
      DOPPLER_IDENTITY_ID: 11d2108f-ddc2-48f6-ad9c-e7fde0043741
      WEBOPS_SKILLS_REPO: yearn/webops-skills
      WEBOPS_SKILLS_SHA: 7542ac1b57766af2e468291e2339f2a620cd7110
      # Kept out of the step expression so the text needs no quote escaping.
      DEFAULT_PROMPT: |
        Review https://github.com/${{ github.repository }}/pull/${{ github.event.issue.number }} using the review-pr-workflow skill.

        This is non-interactive CI. The PR branch is already checked out. Do not post to GitHub. Do not ask questions. Do not wait for approval.
        Do not start a background Workflow and wait for a notification. Run the skill in this session and finish here.

        Reply with the assembled review only (skill Review Format, raw markdown, no preamble, no fence).
      DEFAULT_CLAUDE_ARGS: |
        --setting-sources user
        --allowedTools "Read,Grep,Glob,Skill,Task,Agent,WebFetch,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*),Bash(git *),Bash(bun *),Bash(npm *),Bash(pnpm *),Bash(yarn *)"
    steps:
      # The review runs only when a PR comment starts with /review; any other
      # trigger has nothing to review. Fail before the action produces an
      # obscure error, even if the caller forgot its own gate.
      - name: Reject events other than a /review PR comment
        if: ${{ github.event_name != 'issue_comment' || github.event.issue.pull_request.url == null || !startsWith(github.event.comment.body, '/review') }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_URL: ${{ github.event.issue.pull_request.url }}
          COMMENT: ${{ github.event.comment.body }}
        run: |
          printf '::error::claude-code-review only supports /review comments on pull requests; got event=%s pr_url=%s comment=%s\n' "$EVENT_NAME" "${PR_URL:-}" "${COMMENT:-}" >&2
          exit 1

      # issue_comment still gets an OIDC token for any commenter. Fail before
      # checkout or Doppler so a drive-by /review never fetches the secret.
      - name: Reject commenters without write access
        if: ${{ github.event.comment.author_association != 'OWNER' && github.event.comment.author_association != 'MEMBER' && github.event.comment.author_association != 'COLLABORATOR' }}
        env:
          ASSOCIATION: ${{ github.event.comment.author_association }}
        run: |
          printf '::error::claude-code-review only accepts /review from owners, members, or collaborators; got %s\n' "$ASSOCIATION" >&2
          exit 1

      # issue_comment carries no PR head info; resolve it and refuse fork PRs
      # so the token is never exercised against foreign code.
      - name: Reject fork pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          pr="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '{head: .head.repo.full_name, base: .base.ref}')"
          head_repo="$(printf '%s' "$pr" | jq -r .head)"
          base_ref="$(printf '%s' "$pr" | jq -r .base)"
          if [[ "$head_repo" != "$REPO" ]]; then
            echo "::error::pull requests from forks cannot run the review" >&2
            exit 1
          fi
          echo "PR_BASE_REF=$base_ref" >> "$GITHUB_ENV"

      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch pull request base
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ env.PR_BASE_REF }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      - name: Checkout webops-skills
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.WEBOPS_SKILLS_REPO }}
          ref: ${{ env.WEBOPS_SKILLS_SHA }}
          path: .webops-skills
          persist-credentials: false
          sparse-checkout: |
            skills/review-pr-workflow
            skills/review-pr
            skills/npm-policy

      - name: Install review skills
        run: |
          set -euo pipefail
          mv "$GITHUB_WORKSPACE/.webops-skills" "${RUNNER_TEMP}/webops-skills"
          mkdir -p "$HOME/.claude/skills"
          for s in review-pr-workflow review-pr npm-policy; do
            src="${RUNNER_TEMP}/webops-skills/skills/$s"
            test -d "$src"
            rm -rf "$HOME/.claude/skills/$s"
            cp -a "$src" "$HOME/.claude/skills/$s"
          done

      - name: Load Claude OAuth token from Doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          auth-method: oidc
          doppler-identity-id: ${{ env.DOPPLER_IDENTITY_ID }}
          doppler-project: ${{ env.SHARED_PROJECT }}
          doppler-config: ${{ env.REVIEW_CONFIG }}
          inject-env-vars: true

      - name: Validate Claude credentials
        run: |
          set -euo pipefail
          token="${CLAUDE_CODE_OAUTH_TOKEN:-}"
          token="${token//$'\r'/}"
          token="${token//$'\n'/}"
          token="${token#\"}"
          token="${token%\"}"
          if [[ -z "$token" ]]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN must resolve from Doppler" >&2
            exit 1
          fi
          printf 'token length=%s prefix=%s\n' "${#token}" "${token:0:12}"
          echo "CLAUDE_CODE_OAUTH_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Comment that review started
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "Review started: ${RUN_URL}"

      - name: Run Claude code review
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@9d7150bc8a3dae8149739a88019d192b579ad90c # v1.0.193
        with:
          claude_code_oauth_token: ${{ env.CLAUDE_CODE_OAUTH_TOKEN }}
          # Without an explicit token the action falls back to its Claude
          # GitHub App token, whose permissions ignore this job's block.
          github_token: ${{ github.token }}
          prompt: ${{ env.DEFAULT_PROMPT }}
          claude_args: ${{ env.DEFAULT_CLAUDE_ARGS }}

      - name: Show Claude result envelope
        if: always()
        run: |
          set -euo pipefail
          f="${{ steps.claude.outputs.execution_file }}"
          if [[ -z "$f" || ! -f "$f" ]]; then
            f="${RUNNER_TEMP}/claude-execution-output.json"
          fi
          if [[ ! -f "$f" ]]; then
            echo "::error::no claude-execution-output.json" >&2
            exit 1
          fi
          jq '[.[] | select(.type=="result")] | last | {subtype, is_error, errors, stop_reason, result, total_cost_usd, num_turns}' "$f"

      - name: Comment on PR
        if: steps.claude.outcome == 'success' || steps.claude.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          OUTPUT: ${{ steps.claude.outputs.structured_output }}
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -euo pipefail
          review=""
          if [[ -n "${OUTPUT:-}" ]]; then
            review="$(printf '%s\n' "$OUTPUT" | jq -r '.review // empty')"
          fi
          if [[ -z "$review" || "$review" == "null" ]] && [[ -n "${EXEC_FILE:-}" && -f "$EXEC_FILE" ]]; then
            review="$(jq -r '[.[] | select(.type=="result") | .result // empty] | last // empty' "$EXEC_FILE")"
          fi
          if [[ -z "$review" || "$review" == "null" ]]; then
            echo "::error::claude-code-action produced no review text" >&2
            exit 1
          fi
          if grep -qiE 'wait for the workflow|waiting for .*notification' <<<"$review"; then
            echo "::error::claude exited before assembling a review" >&2
            exit 1
          fi
          printf '%s\n' "$review" > "${RUNNER_TEMP}/review.md"
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file "${RUNNER_TEMP}/review.md"
