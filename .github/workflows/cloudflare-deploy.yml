name: Cloudflare Workers deploy

on:
  workflow_call:
    inputs:
      project:
        description: >-
          Doppler project holding the worker's config: prd for a push to the
          default branch, preview for a pull request. Its values are pushed to
          Cloudflare with wrangler secret bulk before the deploy and, with
          build-command, exported as the build environment. Required when
          sync-secrets is true, and for every pull request, where it also
          names the preview worker (<project>-pr-<number>).
        required: false
        default: ""
        type: string
      sync-secrets:
        description: >-
          Whether the worker has runtime secrets to push from the Doppler
          config. Set false for a worker whose every binding is declared in
          its wrangler config, or for a static site; nothing is then pushed to
          Cloudflare, and without build-command the config is never fetched,
          so no application secret reaches the runner at all.
        required: false
        default: true
        type: boolean
      build-command:
        description: >-
          Command that builds the app before the deploy (e.g. bun run build),
          run in working-directory with the Doppler config as its environment.
          Leave empty for a worker that wrangler bundles by itself.
        required: false
        default: ""
        type: string
      working-directory:
        description: Directory holding the wrangler config, relative to the repository root.
        required: false
        default: "."
        type: string
      identity-id:
        description: Doppler service account identity ID for the event - the preview identity for a pull request, the production identity for a push to the default branch.
        required: true
        type: string
    outputs:
      deployment-url:
        description: Production or preview URL returned by wrangler.
        value: ${{ jobs.deploy.outputs.deployment-url }}

env:
  # Shared Doppler project holding CLOUDFLARE_API_TOKEN and
  # CLOUDFLARE_ACCOUNT_ID, used by every worker deploy. The configs are
  # separate from the Vercel deploy-configs so neither platform's deploy
  # exports the other's credentials onto its runner.
  SHARED_PROJECT: webops-shared-prod
  # Pull requests deploy previews; any other trigger (push to the default
  # branch) deploys production.
  DEPLOY_ENV: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
  # Previews and production share one Cloudflare account and token, the way
  # vercel-deploy.yml shares deploy-configs. Pull request code runs on the
  # runner and can read this token (see specs/doppler-cloudflare.md).
  DEPLOY_CONFIG: cloudflare-deploy-configs
  SECRETS_CONFIG: ${{ github.event_name == 'pull_request' && 'preview' || 'prd' }}
  # One worker per pull request, redeployed on every push to it.
  PREVIEW_NAME: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', inputs.project, github.event.pull_request.number) || '' }}

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    # Serialize per worker so two rapid pushes cannot race and leave it on the
    # older commit. Production is not cancel-in-progress: killing a wrangler
    # deploy mid-upload has no defined outcome, and GitHub supersedes the
    # queued run instead, so the newest commit still wins. A preview is
    # redeployed by the run that cancels it.
    concurrency:
      group: cloudflare-deploy-${{ github.repository }}-${{ inputs.project }}-${{ inputs.working-directory }}-${{ github.event.pull_request.number || 'production' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    cache-mode: none
    permissions:
      contents: read
      id-token: write
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      # Fork PRs never receive an OIDC token; fail explicitly instead of
      # letting the Doppler login error obscure the cause.
      - name: Reject fork pull requests
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::pull requests from forks cannot deploy (no OIDC token is issued)" >&2
          exit 1

      # Production requires a push to the caller's default branch. Enforce it
      # here so pull_request_target, workflow_dispatch, schedule, and
      # non-default-branch pushes can never reach Doppler or wrangler deploy.
      - name: Reject non-default-branch production deploys
        if: env.DEPLOY_ENV == 'production' && (github.event_name != 'push' || github.ref != format('refs/heads/{0}', github.event.repository.default_branch))
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          printf '::error::production deploys are only allowed for a push to the default branch (%s); got %s on %s\n' \
            "$DEFAULT_BRANCH" "$EVENT_NAME" "$REF" >&2
          exit 1

      # `project` is only meaningful when there are secrets to fetch, so it is
      # not a required input — but a caller that syncs secrets and forgets it
      # would otherwise fetch project "" and fail later, inside the step that
      # holds the deploy token. Fail here instead, before any credential.
      - name: Validate inputs
        if: inputs.sync-secrets && inputs.project == ''
        run: |
          echo "::error::project is required when sync-secrets is true; pass the Doppler project holding the worker's runtime secrets, or set sync-secrets: false for a worker with none" >&2
          exit 1

      # The caller workflow of a pull request comes from the pull request, so
      # `project` is untrusted there. The name reaches wrangler arguments and
      # the Cloudflare API path; hold it to a worker-name shape first.
      - name: Validate preview worker name
        if: env.DEPLOY_ENV == 'preview'
        run: |
          if [[ ! "$PREVIEW_NAME" =~ ^[a-z0-9][a-z0-9-]{0,61}[a-z0-9]$ ]]; then
            echo "::error::pull request deploys need a project input of lowercase letters, digits and dashes; it names the preview worker <project>-pr-<number>" >&2
            exit 1
          fi

      - name: Checkout app repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Unlike Vercel there is no remote build: the app is built and bundled
      # on the runner, so project dependencies must be installed. The fleet
      # standardizes on bun, so the caller repository must ship a bun
      # lockfile. The app's own install runs before the Doppler fetch, so its
      # install scripts never see the deploy credentials; this is not an
      # authorization boundary, because any step in this job can mint the
      # OIDC token itself. Both bun and wrangler are pinned: bun here,
      # wrangler by the app repository's lockfile.
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
          no-cache: true

      # Builds run through the app's own scripts, which call node. Pin it
      # rather than inherit whatever the runner image ships.
      - name: Set up Node
        if: inputs.build-command != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      # --frozen-lockfile only rejects a lockfile that would change; with no
      # lockfile at all bun resolves every dependency fresh from the registry,
      # wrangler included, which defeats the app-lockfile wrangler pin. Assert the
      # lockfile explicitly, before the install and before any credential. A
      # standalone package keeps its lockfile in working-directory; a
      # workspace keeps it at the repository root.
      - name: Assert caller ships a bun lockfile
        id: lockfile
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          for dir in "$WORKING_DIRECTORY" .; do
            if [[ -f "$dir/bun.lock" || -f "$dir/bun.lockb" ]]; then
              echo "dir=${dir}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::caller repository must ship bun.lock or bun.lockb in working-directory or at the repository root; without one bun resolves wrangler fresh from the registry and the wrangler pin is lost" >&2
          exit 1

      - name: Install dependencies
        working-directory: ${{ steps.lockfile.outputs.dir }}
        run: bun install --frozen-lockfile

      # wrangler-action passes no wranglerVersion, so it decides whether to
      # install by running `bun run wrangler --version` (its bun execNoInstall
      # command) in working-directory and parsing stdout for a wrangler
      # version; a non-zero exit or no parseable version triggers an unpinned
      # install in the step that already holds the token. Run that exact
      # command here, before any credential is fetched, and fail unless stdout
      # carries a version.
      - name: Assert wrangler runs locally
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          if ! stdout=$(bun run wrangler --version); then
            echo "::error::wrangler must be an installed, runnable dependency of the caller repository (pinned in its lockfile); wrangler-action must not install one alongside the deploy token. Probe stdout: ${stdout}" >&2
            exit 1
          fi
          version=$(printf '%s\n' "$stdout" | grep -Eo -m1 'wrangler [0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?|^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?' || true)
          if [[ -z "$version" ]]; then
            echo "::error::\`bun run wrangler --version\` printed no wrangler version, so wrangler-action would install an unpinned wrangler alongside the deploy token. Probe stdout: ${stdout}" >&2
            exit 1
          fi
          printf 'local wrangler: %s\n' "$version"

      # The app's Doppler config (prd or preview) is read as step outputs,
      # never injected into the job environment. It feeds two steps through
      # explicit env mapping: the build, and the secrets push. A caller with
      # sync-secrets: false and no build-command skips the fetch, so no
      # application secret is fetched at all (see specs/doppler-cloudflare.md).
      - name: Load app config from Doppler
        id: app-config
        if: inputs.project != '' && (inputs.sync-secrets || inputs.build-command != '')
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          auth-method: oidc
          doppler-identity-id: ${{ inputs.identity-id }}
          doppler-project: ${{ inputs.project }}
          doppler-config: ${{ env.SECRETS_CONFIG }}
          inject-env-vars: false

      # The build needs the app config as its environment (NEXT_PUBLIC_*,
      # VITE_* and whatever the framework reads at build time). The values are
      # exported inside this step only — not through GITHUB_ENV, which would
      # hand them to every later step, wrangler-action included. The Cloudflare
      # token has not been fetched yet.
      - name: Build
        if: inputs.build-command != ''
        working-directory: ${{ inputs.working-directory }}
        env:
          YEARN_GHA_APP_CONFIG: ${{ toJSON(steps.app-config.outputs) }}
          YEARN_GHA_BUILD_COMMAND: ${{ inputs.build-command }}
        run: |
          set -euo pipefail
          command=$YEARN_GHA_BUILD_COMMAND
          exports=$(jq -r '(. // {})
            | del(.DOPPLER_PROJECT, .DOPPLER_CONFIG, .DOPPLER_ENVIRONMENT)
            | to_entries[]
            | select(.key | test("^[A-Za-z_][A-Za-z0-9_]*$"))
            | "export \(.key)=\(.value | @sh)"' <<<"$YEARN_GHA_APP_CONFIG")
          unset YEARN_GHA_APP_CONFIG YEARN_GHA_BUILD_COMMAND
          eval "$exports"
          bash -euo pipefail -c "$command"

      # Deploy credentials live alone in their config: a broader config would
      # pull other secrets onto the runner. The values are read as step
      # outputs, never injected into the job environment; only the validate
      # step and the secrets push step (explicit env mapping) and the
      # wrangler-action inputs receive them. With no wranglerVersion input,
      # wrangler-action uses the wrangler the app repository already
      # installed; the preceding probe is what guarantees no install runs in
      # the steps that hold the token.
      - name: Load shared Cloudflare token and account ID from Doppler
        id: doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          auth-method: oidc
          doppler-identity-id: ${{ inputs.identity-id }}
          doppler-project: ${{ env.SHARED_PROJECT }}
          doppler-config: ${{ env.DEPLOY_CONFIG }}
          inject-env-vars: false

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.doppler.outputs.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.doppler.outputs.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for var in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [[ -z "${!var:-}" ]]; then
              echo "::error::${var} must resolve from its configured Doppler project" >&2
              exit 1
            fi
          done

      # A preview pushes to its own worker. --env is left out on purpose:
      # wrangler's secret commands append the environment to --name
      # (<name>-preview), while `wrangler deploy --env preview --name <name>`
      # deploys to <name>.
      - name: Push worker runtime secrets to Cloudflare
        if: inputs.sync-secrets
        working-directory: ${{ inputs.working-directory }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.doppler.outputs.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.doppler.outputs.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_SECRETS: ${{ toJSON(steps.app-config.outputs) }}
          PROJECT: ${{ inputs.project }}
        run: |
          set -euo pipefail
          secrets=$(jq -c 'del(.DOPPLER_PROJECT, .DOPPLER_CONFIG, .DOPPLER_ENVIRONMENT)' <<<"$WORKER_SECRETS")
          if [[ "$(jq 'length' <<<"$secrets")" -eq 0 ]]; then
            echo "::error::no worker secrets resolved from Doppler project ${PROJECT} config ${SECRETS_CONFIG}" >&2
            exit 1
          fi
          name_args=()
          if [[ -n "$PREVIEW_NAME" ]]; then
            name_args=(--name "$PREVIEW_NAME")
          fi
          printf '%s' "$secrets" | bun run wrangler secret bulk ${name_args[@]+"${name_args[@]}"}

      # packageManager is explicit: wrangler-action otherwise detects it from
      # the lockfile in workingDirectory, falls back to npm when there is none
      # (a workspace package), and would then probe and install with npm
      # instead of the bun probe above. A preview deploys the wrangler
      # config's `preview` environment under the per-pull-request name.
      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ steps.doppler.outputs.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ steps.doppler.outputs.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ inputs.working-directory }}
          packageManager: bun
          command: ${{ env.DEPLOY_ENV == 'preview' && format('deploy --env preview --name {0}', env.PREVIEW_NAME) || 'deploy' }}

  # Separate job so the token that can write to the pull request never shares
  # a runner with pull request code or the deploy credentials.
  comment:
    name: Comment preview URL
    needs: deploy
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    cache-mode: none
    permissions:
      pull-requests: write
    steps:
      # One comment per project, updated in place, so a multi-project caller
      # shows every preview URL.
      - name: Upsert preview comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PROJECT: ${{ inputs.project }}
          DEPLOYMENT_URL: ${{ needs.deploy.outputs.deployment-url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          marker="<!-- cloudflare-preview:${PROJECT} -->"
          body=$(printf '%s\nCloudflare preview for `%s`: %s\n\nCommit %s' \
            "$marker" "$PROJECT" "${DEPLOYMENT_URL:-no URL returned by wrangler, see the deploy job}" "$HEAD_SHA")
          id=$(gh api --paginate "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            | jq -rs --arg marker "$marker" '[.[][] | select(.body | startswith($marker)) | .id][0] // empty')
          if [[ -n "$id" ]]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${id}" -f body="$body" >/dev/null
          else
            gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" -f body="$body" >/dev/null
          fi

  # Closing the pull request removes its preview worker. No checkout and no
  # install: only the pinned fetch action, curl and jq hold the token.
  delete:
    name: Delete Cloudflare preview
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Same group as the pull request's deploys, so an in-flight deploy is
    # cancelled rather than recreating the worker after the delete.
    concurrency:
      group: cloudflare-deploy-${{ github.repository }}-${{ inputs.project }}-${{ inputs.working-directory }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    cache-mode: none
    permissions:
      id-token: write
    steps:
      - name: Validate preview worker name
        run: |
          if [[ ! "$PREVIEW_NAME" =~ ^[a-z0-9][a-z0-9-]{0,61}[a-z0-9]$ ]]; then
            echo "::error::pull request deploys need a project input of lowercase letters, digits and dashes; it names the preview worker <project>-pr-<number>" >&2
            exit 1
          fi

      - name: Load shared Cloudflare token and account ID from Doppler
        id: doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          auth-method: oidc
          doppler-identity-id: ${{ inputs.identity-id }}
          doppler-project: ${{ env.SHARED_PROJECT }}
          doppler-config: ${{ env.DEPLOY_CONFIG }}
          inject-env-vars: false

      - name: Delete preview worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.doppler.outputs.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.doppler.outputs.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for var in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [[ -z "${!var:-}" ]]; then
              echo "::error::${var} must resolve from its configured Doppler project" >&2
              exit 1
            fi
          done
          status=$(curl -sS -o "${RUNNER_TEMP}/delete.json" -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${PREVIEW_NAME}?force=true")
          case "$status" in
            200) echo "deleted ${PREVIEW_NAME}" ;;
            404) echo "${PREVIEW_NAME} does not exist, nothing to delete" ;;
            *)
              echo "::error::deleting ${PREVIEW_NAME} returned HTTP ${status}: $(jq -c '.errors' "${RUNNER_TEMP}/delete.json" 2>/dev/null || true)" >&2
              exit 1 ;;
          esac
