name: Cloudflare Workers deploy

on:
  workflow_call:
    inputs:
      project:
        description: >-
          Doppler project for this worker. Its cloudflare-deploy-configs
          config holds the production token scoped to this Worker only; prd
          and preview hold the matching app config. It also names preview
          workers (<project>-pr-<number>).
        required: true
        type: string
      sync-secrets:
        description: >-
          Whether the worker has runtime secrets to push from the Doppler
          config. Set false for a worker whose every binding is declared in
          its wrangler config, or for a static site; nothing is then pushed to
          Cloudflare, and without a build the app config is never fetched.
          The event-specific deploy credential is still fetched.
        required: false
        default: true
        type: boolean
      build-command:
        description: >-
          Fallback build command (e.g. bun run build) for an app whose
          package.json has no build:cloudflare script. When that script exists
          it is the build (bun run build:cloudflare) and this input is ignored.
          Either runs in working-directory with the Doppler config as its
          environment. Leave empty for a worker that wrangler bundles by itself.
        required: false
        default: ""
        type: string
      working-directory:
        description: Directory holding the wrangler config, relative to the repository root.
        required: false
        default: "."
        type: string
      identity-id:
        description: >-
          Doppler identity for the deploy job, which runs in the
          cloudflare-preview or cloudflare-production GitHub environment and
          executes no repository code. Pull requests use the preview deploy
          identity, pushes the production one. Each sits on its own service
          account, because Doppler grants access per service account.
        required: true
        type: string
      build-identity-id:
        description: >-
          Doppler identity for the build job, which runs the repository's code.
          Pull requests use an identity on a service account that reads only
          <project>/preview; pushes use one that reads <project>/prd. Required
          when the build needs the app config (a build:cloudflare script or
          build-command).
        required: false
        default: ""
        type: string
    outputs:
      deployment-url:
        description: Production or preview URL returned by wrangler.
        value: ${{ jobs.deploy.outputs.deployment-url }}

env:
  # Only previews use a shared deploy credential. It is Workers-product Admin,
  # because dynamic <project>-pr-<number> workers cannot be scoped before
  # they exist. Production credentials live in <project>/cloudflare-deploy-configs
  # and carry Individual Workers Editor for that one existing worker.
  SHARED_PROJECT: webops-shared-prod
  # Pull requests deploy previews; any other trigger (push to the default
  # branch) deploys production.
  DEPLOY_ENV: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
  DEPLOY_CONFIG: ${{ github.event_name == 'pull_request' && 'cloudflare-preview-deploy-configs' || 'cloudflare-deploy-configs' }}
  SECRETS_CONFIG: ${{ github.event_name == 'pull_request' && 'preview' || 'prd' }}
  # One worker per pull request, redeployed on every push to it.
  PREVIEW_NAME: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', inputs.project, github.event.pull_request.number) || '' }}
  # The deploy job installs this wrangler itself; the repository's lockfile
  # never chooses the binary that holds the Cloudflare token.
  WRANGLER_VERSION: "4.165.0"

jobs:
  # Runs the repository's code: install, build and wrangler bundling. It holds
  # no Cloudflare credential, and its Doppler identity can read only the app
  # config of the event (preview or prd). Pull request code can mint that
  # identity's OIDC token, so nothing more sensitive than <project>/preview
  # is reachable from here.
  build:
    name: Build
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-build-${{ github.repository }}-${{ inputs.project }}-${{ inputs.working-directory }}-${{ github.event.pull_request.number || 'production' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    cache-mode: none
    permissions:
      contents: read
      id-token: write
    steps:
      # Fork PRs never receive an OIDC token; fail explicitly instead of
      # letting the Doppler login error obscure the cause.
      - name: Reject fork pull requests
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::pull requests from forks cannot deploy (no OIDC token is issued)" >&2
          exit 1

      # Production requires a push to the caller's default branch. Enforce it
      # here so pull_request_target, workflow_dispatch, schedule, and
      # non-default-branch pushes can never reach Doppler or wrangler deploy.
      - name: Reject non-default-branch production deploys
        if: env.DEPLOY_ENV == 'production' && (github.event_name != 'push' || github.ref != format('refs/heads/{0}', github.event.repository.default_branch))
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          printf '::error::production deploys are only allowed for a push to the default branch (%s); got %s on %s\n' \
            "$DEFAULT_BRANCH" "$EVENT_NAME" "$REF" >&2
          exit 1

      # The caller workflow of a pull request comes from the pull request, so
      # `project` is untrusted there. The name reaches wrangler arguments and
      # the Cloudflare API path; hold it to a worker-name shape first.
      - name: Validate preview worker name
        if: env.DEPLOY_ENV == 'preview'
        run: |
          if [[ ! "$PREVIEW_NAME" =~ ^[a-z0-9][a-z0-9-]{0,61}[a-z0-9]$ ]]; then
            echo "::error::pull request deploys need a project input of lowercase letters, digits and dashes; it names the preview worker <project>-pr-<number>" >&2
            exit 1
          fi

      - name: Checkout app repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The app's own build:cloudflare script is the build; the build-command
      # input is the fallback for a repository without one.
      - name: Detect build script
        id: build-script
        working-directory: ${{ inputs.working-directory }}
        run: |
          if [[ -f package.json ]] && jq -e '.scripts["build:cloudflare"]' package.json >/dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
          no-cache: true

      # Builds and wrangler's bundler run on node. Pin it rather than inherit
      # whatever the runner image ships.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      # Without a lockfile bun resolves every dependency fresh from the
      # registry. A standalone package keeps its lockfile in
      # working-directory; a workspace keeps it at the repository root.
      - name: Assert caller ships a bun lockfile
        id: lockfile
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          for dir in "$WORKING_DIRECTORY" .; do
            if [[ -f "$dir/bun.lock" || -f "$dir/bun.lockb" ]]; then
              echo "dir=${dir}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::caller repository must ship bun.lock or bun.lockb in working-directory or at the repository root" >&2
          exit 1

      - name: Install dependencies
        working-directory: ${{ steps.lockfile.outputs.dir }}
        run: bun install --frozen-lockfile

      - name: Require a build identity
        if: (steps.build-script.outputs.found == 'true' || inputs.build-command != '') && inputs.build-identity-id == ''
        run: |
          echo "::error::the build reads the app config from Doppler; pass build-identity-id (preview build identity for pull requests, production build identity for pushes)" >&2
          exit 1

      # The app's Doppler config (prd or preview) is read as step outputs and
      # handed to the build step only, never through GITHUB_ENV.
      - name: Load app config from Doppler
        id: app-config
        if: steps.build-script.outputs.found == 'true' || inputs.build-command != ''
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          auth-method: oidc
          doppler-identity-id: ${{ inputs.build-identity-id }}
          doppler-project: ${{ inputs.project }}
          doppler-config: ${{ env.SECRETS_CONFIG }}
          inject-env-vars: false

      - name: Build
        if: steps.build-script.outputs.found == 'true' || inputs.build-command != ''
        working-directory: ${{ inputs.working-directory }}
        env:
          YEARN_GHA_APP_CONFIG: ${{ toJSON(steps.app-config.outputs) }}
          YEARN_GHA_BUILD_COMMAND: ${{ inputs.build-command }}
          YEARN_GHA_BUILD_SCRIPT: ${{ steps.build-script.outputs.found }}
        run: |
          set -euo pipefail
          command=$YEARN_GHA_BUILD_COMMAND
          if [[ "$YEARN_GHA_BUILD_SCRIPT" == true ]]; then
            command='bun run build:cloudflare'
          fi
          exports=$(jq -r '(. // {})
            | del(.DOPPLER_PROJECT, .DOPPLER_CONFIG, .DOPPLER_ENVIRONMENT)
            | to_entries[]
            | select(.key | test("^[A-Za-z_][A-Za-z0-9_]*$"))
            | "export \(.key)=\(.value | @sh)"' <<<"$YEARN_GHA_APP_CONFIG")
          unset YEARN_GHA_APP_CONFIG YEARN_GHA_BUILD_COMMAND YEARN_GHA_BUILD_SCRIPT
          eval "$exports"
          bash -euo pipefail -c "$command"

      # Stages what the deploy job uploads: the static assets directory and,
      # for a worker with code, wrangler's bundle (dry run, no credential).
      # The deploy job pairs these with the default branch's wrangler config,
      # so this job's config only decides which files are staged.
      - name: Stage assets and bundle
        working-directory: ${{ inputs.working-directory }}
        env:
          STAGE: ${{ runner.temp }}/cloudflare-artifact
        run: |
          set -euo pipefail
          config=$(ls wrangler.jsonc wrangler.json wrangler.toml 2>/dev/null | head -n1 || true)
          if [[ -z "$config" ]]; then
            echo "::error::no wrangler config in working-directory" >&2
            exit 1
          fi
          env_args=()
          if [[ "$DEPLOY_ENV" == preview ]]; then
            env_args=(--env preview)
          fi
          read -r main assets < <(CONFIG="$config" ENV_NAME="${env_args[1]:-}" node -e '
            const path = require("path")
            const { unstable_readConfig } = require("wrangler")
            const c = unstable_readConfig({ config: process.env.CONFIG, env: process.env.ENV_NAME || undefined })
            const dir = path.dirname(path.resolve(process.env.CONFIG))
            const rel = (p) => (p ? path.relative(process.cwd(), path.resolve(dir, p)) : "-")
            console.log(rel(c.main), rel(c.assets && c.assets.directory))')
          mkdir -p "$STAGE"
          if [[ "$assets" != - ]]; then
            cp -R "$assets" "$STAGE/assets"
          fi
          if [[ "$main" != - ]]; then
            bun run wrangler deploy --dry-run --outdir "$STAGE/bundle" ${env_args[@]+"${env_args[@]}"}
          fi
          ls -A "$STAGE"

      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloudflare-build-${{ inputs.project }}
          path: ${{ runner.temp }}/cloudflare-artifact
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Holds the Cloudflare token and runs no repository code: no checkout of the
  # pull request, no install, no repository scripts. It deploys the build
  # artifact with the wrangler pinned above and the default branch's wrangler
  # config, so a pull request cannot change the worker name, routes, bindings
  # or the binary. The GitHub environment changes the OIDC subject to
  # repo:<repo>:environment:<name>, which the build job cannot mint, so only
  # this job's identity can read the deploy config.
  deploy:
    name: Deploy to Cloudflare Workers
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'pull_request' && 'cloudflare-preview' || 'cloudflare-production' }}
    # Serialize per worker so two rapid pushes cannot race and leave it on the
    # older commit. Production is not cancel-in-progress: killing a wrangler
    # deploy mid-upload has no defined outcome, and GitHub supersedes the
    # queued run instead, so the newest commit still wins.
    concurrency:
      group: cloudflare-deploy-${{ github.repository }}-${{ inputs.project }}-${{ inputs.working-directory }}-${{ github.event.pull_request.number || 'production' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    cache-mode: none
    permissions:
      contents: read
      id-token: write
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Checkout wrangler config from the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: default-branch
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            wrangler.jsonc
            wrangler.json
            wrangler.toml

      - name: Download build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cloudflare-build-${{ inputs.project }}
          path: ${{ runner.temp }}/cloudflare-artifact

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install wrangler
        env:
          PREFIX: ${{ runner.temp }}/wrangler
        run: |
          set -euo pipefail
          npm install --prefix "$PREFIX" --no-save --no-audit --no-fund --ignore-scripts "wrangler@${WRANGLER_VERSION}"
          echo "$PREFIX/node_modules/.bin" >> "$GITHUB_PATH"

      # A clean directory with the default branch's config, the staged assets
      # at the path that config names, and the bundle as an explicit entry.
      - name: Assemble deployment
        id: assemble
        env:
          SOURCE: default-branch/${{ inputs.working-directory }}
          ARTIFACT: ${{ runner.temp }}/cloudflare-artifact
          OUT: ${{ runner.temp }}/cloudflare-deploy
          WRANGLER_PKG: ${{ runner.temp }}/wrangler/node_modules/wrangler
        run: |
          set -euo pipefail
          config=$(cd "$SOURCE" 2>/dev/null && ls wrangler.jsonc wrangler.json wrangler.toml 2>/dev/null | head -n1 || true)
          if [[ -z "$config" ]]; then
            echo "::error::the default branch has no wrangler config in working-directory; previews deploy only once it is merged" >&2
            exit 1
          fi
          mkdir -p "$OUT"
          cp "$SOURCE/$config" "$OUT/$config"
          cd "$OUT"
          read -r main assets < <(CONFIG="$config" node -e '
            const path = require("path")
            const { unstable_readConfig } = require(process.env.WRANGLER_PKG)
            const c = unstable_readConfig({ config: process.env.CONFIG, env: process.env.DEPLOY_ENV === "preview" ? "preview" : undefined })
            const rel = (p) => (p ? path.relative(process.cwd(), path.resolve(p)) : "-")
            const routes = [...(c.routes || []), ...(c.route ? [c.route] : [])]
            if (process.env.DEPLOY_ENV === "preview" && routes.length) {
              console.error("::error::the default branch wrangler config gives the preview environment routes")
              process.exit(1)
            }
            console.log(rel(c.main), c.assets && c.assets.directory ? rel(c.assets.directory) : "-")')
          for p in "$main" "$assets"; do
            if [[ "$p" != - && ( "$p" == /* || "$p" == ..* ) ]]; then
              echo "::error::wrangler config paths must stay inside working-directory: $p" >&2
              exit 1
            fi
          done
          if [[ "$assets" != - ]]; then
            mkdir -p "$(dirname "$assets")"
            cp -R "$ARTIFACT/assets" "$assets"
          fi
          entry=""
          if [[ "$main" != - ]]; then
            name=$(basename "$main")
            entry=".cloudflare-bundle/${name%.*}.js"
            cp -R "$ARTIFACT/bundle" .cloudflare-bundle
            if [[ ! -f "$entry" ]]; then
              echo "::error::the build bundle has no ${entry}" >&2
              exit 1
            fi
          fi
          {
            echo "config=$config"
            echo "entry=$entry"
          } >> "$GITHUB_OUTPUT"

      - name: Load app config from Doppler
        id: app-config
        if: inputs.sync-secrets
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          auth-method: oidc
          doppler-identity-id: ${{ inputs.identity-id }}
          doppler-project: ${{ inputs.project }}
          doppler-config: ${{ env.SECRETS_CONFIG }}
          inject-env-vars: false

      - name: Load Cloudflare token and account ID from Doppler
        id: doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          auth-method: oidc
          doppler-identity-id: ${{ inputs.identity-id }}
          doppler-project: ${{ env.DEPLOY_ENV == 'preview' && env.SHARED_PROJECT || inputs.project }}
          doppler-config: ${{ env.DEPLOY_CONFIG }}
          inject-env-vars: false

      # A preview pushes to its own worker. --env is left out on purpose:
      # wrangler's secret commands append the environment to --name
      # (<name>-preview), while `wrangler deploy --env preview --name <name>`
      # deploys to <name>.
      - name: Push worker runtime secrets to Cloudflare
        if: inputs.sync-secrets
        working-directory: ${{ runner.temp }}/cloudflare-deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.doppler.outputs.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.doppler.outputs.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_SECRETS: ${{ toJSON(steps.app-config.outputs) }}
          PROJECT: ${{ inputs.project }}
          CONFIG: ${{ steps.assemble.outputs.config }}
        run: |
          set -euo pipefail
          for var in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [[ -z "${!var:-}" ]]; then
              echo "::error::${var} must resolve from its configured Doppler project" >&2
              exit 1
            fi
          done
          secrets=$(jq -c 'del(.DOPPLER_PROJECT, .DOPPLER_CONFIG, .DOPPLER_ENVIRONMENT)' <<<"$WORKER_SECRETS")
          if [[ "$(jq 'length' <<<"$secrets")" -eq 0 ]]; then
            echo "::error::no worker secrets resolved from Doppler project ${PROJECT} config ${SECRETS_CONFIG}" >&2
            exit 1
          fi
          name_args=()
          if [[ -n "$PREVIEW_NAME" ]]; then
            name_args=(--name "$PREVIEW_NAME")
          fi
          printf '%s' "$secrets" | wrangler secret bulk --config "$CONFIG" ${name_args[@]+"${name_args[@]}"}

      # On the first deploy of a new worker name, wrangler uploads the script
      # and then reads it back from /workers/workers/<name>, which can answer
      # 10007 "does not exist" for a few minutes; wrangler does not retry a
      # 404. Redeploying after a pause succeeds once the worker is visible.
      - name: Deploy to Cloudflare Workers
        id: deploy
        working-directory: ${{ runner.temp }}/cloudflare-deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.doppler.outputs.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.doppler.outputs.CLOUDFLARE_ACCOUNT_ID }}
          CONFIG: ${{ steps.assemble.outputs.config }}
          ENTRY: ${{ steps.assemble.outputs.entry }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
        run: |
          set -euo pipefail
          for var in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [[ -z "${!var:-}" ]]; then
              echo "::error::${var} must resolve from its configured Doppler project" >&2
              exit 1
            fi
          done
          args=(deploy --config "$CONFIG")
          if [[ -n "$ENTRY" ]]; then
            args+=("$ENTRY" --no-bundle)
          fi
          if [[ "$DEPLOY_ENV" == preview ]]; then
            args+=(--env preview --name "$PREVIEW_NAME")
          fi
          for attempt in 1 2 3 4; do
            if wrangler "${args[@]}"; then
              url=$(jq -rs '[.[] | select(.type == "deploy") | .targets[]?] | map(select(test("^https://"))) | first // empty' "$WRANGLER_OUTPUT_FILE_PATH")
              echo "deployment-url=${url}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ $attempt -lt 4 ]]; then
              echo "deploy attempt ${attempt} failed; retrying in 60s"
              sleep 60
            fi
          done
          exit 1

  # Separate job so the token that can write to the pull request never shares
  # a runner with pull request code or the deploy credentials.
  comment:
    name: Comment preview URL
    needs: deploy
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    cache-mode: none
    permissions:
      pull-requests: write
    steps:
      # One comment per project, updated in place, so a multi-project caller
      # shows every preview URL.
      - name: Upsert preview comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PROJECT: ${{ inputs.project }}
          DEPLOYMENT_URL: ${{ needs.deploy.outputs.deployment-url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          marker="<!-- cloudflare-preview:${PROJECT} -->"
          body=$(printf '%s\nCloudflare preview for `%s`: %s\n\nCommit %s' \
            "$marker" "$PROJECT" "${DEPLOYMENT_URL:-no URL returned by wrangler, see the deploy job}" "$HEAD_SHA")
          id=$(gh api --paginate "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            | jq -rs --arg marker "$marker" '[.[][] | select(.body | startswith($marker)) | .id][0] // empty')
          if [[ -n "$id" ]]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${id}" -f body="$body" >/dev/null
          else
            gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" -f body="$body" >/dev/null
          fi

  # Closing the pull request removes its preview worker. No checkout and no
  # install: only the pinned fetch action, curl and jq hold the token.
  delete:
    name: Delete Cloudflare preview
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Same group as the pull request's deploys, so an in-flight deploy is
    # cancelled rather than recreating the worker after the delete.
    concurrency:
      group: cloudflare-deploy-${{ github.repository }}-${{ inputs.project }}-${{ inputs.working-directory }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    environment: cloudflare-preview
    cache-mode: none
    permissions:
      id-token: write
    steps:
      - name: Validate preview worker name
        run: |
          if [[ ! "$PREVIEW_NAME" =~ ^[a-z0-9][a-z0-9-]{0,61}[a-z0-9]$ ]]; then
            echo "::error::pull request deploys need a project input of lowercase letters, digits and dashes; it names the preview worker <project>-pr-<number>" >&2
            exit 1
          fi

      - name: Load shared Cloudflare token and account ID from Doppler
        id: doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          auth-method: oidc
          doppler-identity-id: ${{ inputs.identity-id }}
          doppler-project: ${{ env.SHARED_PROJECT }}
          doppler-config: ${{ env.DEPLOY_CONFIG }}
          inject-env-vars: false

      - name: Delete preview worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.doppler.outputs.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.doppler.outputs.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for var in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [[ -z "${!var:-}" ]]; then
              echo "::error::${var} must resolve from its configured Doppler project" >&2
              exit 1
            fi
          done
          status=$(curl -sS -o "${RUNNER_TEMP}/delete.json" -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${PREVIEW_NAME}?force=true")
          case "$status" in
            200) echo "deleted ${PREVIEW_NAME}" ;;
            404) echo "${PREVIEW_NAME} does not exist, nothing to delete" ;;
            *)
              echo "::error::deleting ${PREVIEW_NAME} returned HTTP ${status}: $(jq -c '.errors' "${RUNNER_TEMP}/delete.json" 2>/dev/null || true)" >&2
              exit 1 ;;
          esac
