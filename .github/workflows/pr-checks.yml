name: PR checks

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version to install (ignored when the package manager is bun).
        required: false
        type: string
        default: '22'

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Detect package manager
        id: pm
        run: |
          set -euo pipefail
          if [[ -f bun.lock || -f bun.lockb ]]; then
            pm=bun
            locked=true
          elif [[ -f pnpm-lock.yaml ]]; then
            pm=pnpm
            locked=true
          elif [[ -f yarn.lock ]]; then
            pm=yarn
            locked=true
          elif [[ -f package-lock.json || -f npm-shrinkwrap.json ]]; then
            pm=npm
            locked=true
          else
            pm=npm
            locked=false
          fi
          echo "detected package manager: $pm (lockfile: $locked)"
          echo "pm=$pm" >> "$GITHUB_OUTPUT"
          echo "locked=$locked" >> "$GITHUB_OUTPUT"
          echo "PM=$pm" >> "$GITHUB_ENV"
          echo "LOCKED=$locked" >> "$GITHUB_ENV"

      # Must run before setup-node: setup-node's cache: pnpm/yarn fails if the
      # binary is absent, and corepack is what installs it.
      - name: Enable corepack
        if: steps.pm.outputs.pm == 'pnpm' || steps.pm.outputs.pm == 'yarn'
        run: corepack enable

      - name: Setup Bun
        if: steps.pm.outputs.pm == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Setup Node
        if: steps.pm.outputs.pm != 'bun'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ steps.pm.outputs.locked == 'true' && steps.pm.outputs.pm || '' }}

      - name: Install dependencies
        run: |
          set -euo pipefail
          if [[ "$LOCKED" != true ]]; then
            echo "no lockfile found; installing without a frozen lockfile"
            npm install
            exit 0
          fi
          case "$PM" in
            bun) bun install --frozen-lockfile ;;
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --immutable ;;
            *) npm ci ;;
          esac

      - name: Lint
        run: |
          set -euo pipefail
          for script in lint; do
            # jq -e exits 1 on a missing key; the if guard keeps errexit from killing the loop.
            if jq -e --arg s "$script" '.scripts[$s] // empty | select(length > 0)' package.json >/dev/null; then
              echo "running $PM run $script"
              "$PM" run "$script"
              exit 0
            fi
          done
          echo "no lint script in package.json; skipped"

      - name: Format
        run: |
          set -euo pipefail
          for script in format:check; do
            if jq -e --arg s "$script" '.scripts[$s] // empty | select(length > 0)' package.json >/dev/null; then
              echo "running $PM run $script"
              "$PM" run "$script"
              exit 0
            fi
          done
          echo "no format script in package.json; skipped"

      - name: Typecheck
        run: |
          set -euo pipefail
          for script in typecheck type-check; do
            if jq -e --arg s "$script" '.scripts[$s] // empty | select(length > 0)' package.json >/dev/null; then
              echo "running $PM run $script"
              "$PM" run "$script"
              exit 0
            fi
          done
          echo "no typecheck script in package.json; skipped"

      - name: Test
        run: |
          set -euo pipefail
          for script in test; do
            if jq -e --arg s "$script" '.scripts[$s] // empty | select(length > 0)' package.json >/dev/null; then
              echo "running $PM run $script"
              "$PM" run "$script"
              exit 0
            fi
          done
          echo "no test script in package.json; skipped"
