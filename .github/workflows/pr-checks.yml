name: PR checks

on:
  workflow_call:
    inputs:
      bun-version:
        description: Bun version to install.
        required: false
        type: string
        default: '1.3.14'

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: |
          set -euo pipefail
          for script in lint; do
            if jq -e --arg s "$script" '.scripts[$s] // empty | select(length > 0)' package.json >/dev/null; then
              echo "running bun run $script"
              exec bun run "$script"
            fi
          done
          echo "no lint script in package.json; skipped"

      - name: Format
        run: |
          set -euo pipefail
          for script in format:check; do
            if jq -e --arg s "$script" '.scripts[$s] // empty | select(length > 0)' package.json >/dev/null; then
              echo "running bun run $script"
              exec bun run "$script"
            fi
          done
          echo "no format:check script in package.json; skipped"

      - name: Typecheck
        run: |
          set -euo pipefail
          for script in typecheck type-check; do
            if jq -e --arg s "$script" '.scripts[$s] // empty | select(length > 0)' package.json >/dev/null; then
              echo "running bun run $script"
              exec bun run "$script"
            fi
          done
          echo "no typecheck script in package.json; skipped"

      - name: Test
        run: |
          set -euo pipefail
          for script in test; do
            if jq -e --arg s "$script" '.scripts[$s] // empty | select(length > 0)' package.json >/dev/null; then
              echo "running bun run $script"
              exec bun run "$script"
            fi
          done
          echo "no test script in package.json; skipped"
