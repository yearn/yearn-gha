name: Vercel deploy

on:
  workflow_call:
    inputs:
      project:
        description: Doppler project containing VERCEL_PROJECT_ID in the deploy config.
        required: true
        type: string
      identity-id:
        description: Doppler service account identity ID matching the deploy environment (preview identity for pull requests, production identity for the default branch).
        required: true
        type: string
    outputs:
      deployment-url:
        description: Preview or production URL returned by Vercel.
        value: ${{ jobs.deploy.outputs.deployment-url }}

env:
  # Shared Doppler project holding VERCEL_TOKEN and VERCEL_ORG_ID in the
  # deploy config, used by every app deploy.
  SHARED_PROJECT: webops-shared-prod
  # Config slug used by both the shared and app fetches.
  DEPLOY_CONFIG: deploy-configs
  # Pull requests deploy previews; any other trigger (push to the default
  # branch) deploys production.
  DEPLOY_ENV: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      id-token: write
      pull-requests: write
    outputs:
      deployment-url: ${{ steps.deploy.outputs.preview-url }}
    steps:
      # Fork PRs never receive an OIDC token; fail explicitly instead of
      # letting the Doppler login error obscure the cause.
      - name: Reject fork pull requests
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::pull requests from forks cannot deploy (no OIDC token is issued)" >&2
          exit 1

      # Production is documented to require a push to the caller's default
      # branch. Enforce it here so workflow_dispatch, schedule, and
      # non-default-branch pushes can never reach Doppler or deploy --prod.
      - name: Reject non-default-branch production deploys
        if: env.DEPLOY_ENV == 'production' && (github.event_name != 'push' || github.ref != format('refs/heads/{0}', github.event.repository.default_branch))
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          printf '::error::production deploys are only allowed for a push to the default branch (%s); got %s on %s\n' \
            "$DEFAULT_BRANCH" "$EVENT_NAME" "$REF" >&2
          exit 1

      - name: Checkout app repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Deploy credentials live alone in the deploy config: the action
      # exports every secret in the config, so a broader config would pull
      # app secrets onto the runner. App secrets reach Vercel via Doppler
      # integrations, never through this workflow.
      - name: Load shared Vercel token and org ID from Doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          auth-method: oidc
          # Same identity as the app fetch; must have read on shared deploy.
          doppler-identity-id: ${{ inputs.identity-id }}
          doppler-project: ${{ env.SHARED_PROJECT }}
          doppler-config: ${{ env.DEPLOY_CONFIG }}
          inject-env-vars: true

      # Loads the app's VERCEL_PROJECT_ID from deploy-configs. Never fetch
      # prd/preview here; those sync to Vercel and would dump app secrets
      # onto the runner.
      - name: Load app Vercel project ID from Doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          auth-method: oidc
          doppler-identity-id: ${{ inputs.identity-id }}
          doppler-project: ${{ inputs.project }}
          doppler-config: ${{ env.DEPLOY_CONFIG }}
          inject-env-vars: true

      - name: Validate Vercel credentials
        run: |
          set -euo pipefail
          for var in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!var:-}" ]]; then
              echo "::error::${var} must resolve from its configured Doppler project" >&2
              exit 1
            fi
          done

      - name: Deploy to Vercel
        id: deploy
        uses: amondnet/vercel-action@de09aeac2ace6599ec9b11ef87558759a496bac4 # v42.3.0
        with:
          vercel-token: ${{ env.VERCEL_TOKEN }}
          vercel-org-id: ${{ env.VERCEL_ORG_ID }}
          vercel-project-id: ${{ env.VERCEL_PROJECT_ID }}
          vercel-version: 55.0.0
          # The action keys its PR comment on this name; without it multi-project
          # callers collide on one comment and only the last URL survives.
          vercel-project-name: ${{ inputs.project }}
          # CLI mode does not forward `target`; --prod is what promotes the
          # deployment. The build runs on Vercel with its synced env vars.
          vercel-args: ${{ env.DEPLOY_ENV == 'production' && '--prod' || '' }}
          github-token: ${{ github.token }}
          github-comment: true
          github-deployment: true
          github-deployment-environment: ${{ env.DEPLOY_ENV }}
