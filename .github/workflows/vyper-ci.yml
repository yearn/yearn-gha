name: Vyper CI

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version for setup-uv (Vyper tooling).
        required: false
        type: string
        default: "3.11.9"
      uv-version:
        description: uv version installed by astral-sh/setup-uv.
        required: false
        type: string
        default: "0.11.21"
      sync-args:
        description: Extra arguments for `uv sync` after --locked.
        required: false
        type: string
        default: ""
      compile-command:
        description: >-
          Shell command that compiles Vyper contracts after uv sync.
          The caller must pin vyper in its lockfile/pyproject (see
          yearn/yearn-vesting-escrow). Example: uv run --locked vesting-escrow-compile
        required: true
        type: string
      test-command:
        description: Shell command for tests (pytest/ape/etc). Used when run-tests is true.
        required: false
        type: string
        default: uv run --locked pytest
      run-tests:
        description: Run test-command after a successful compile.
        required: false
        type: boolean
        default: true

jobs:
  contracts:
    name: Vyper compile and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ inputs.uv-version }}
          python-version: ${{ inputs.python-version }}
          enable-cache: true

      - name: Install dependencies
        env:
          SYNC_ARGS: ${{ inputs.sync-args }}
        run: |
          set -euo pipefail
          # Caller pins vyper (and friends) in uv.lock / pyproject; this step
          # never installs an unpinned vyper from PyPI directly.
          uv sync --locked ${SYNC_ARGS}

      - name: Compile contracts
        env:
          COMPILE_COMMAND: ${{ inputs.compile-command }}
        run: |
          set -euo pipefail
          # Slither/Aderyn do not cover .vy; compile is the primary gate.
          bash -lc "$COMPILE_COMMAND"

      - name: Run tests
        if: inputs.run-tests
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: |
          set -euo pipefail
          bash -lc "$TEST_COMMAND"
