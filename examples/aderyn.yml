name: Aderyn

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: aderyn-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    uses: yearn/yearn-gha/.github/workflows/aderyn.yml@<approved-sha> # pin to the approved full commit SHA
