# Caller for a worker with no runtime secrets. Every binding
# yearn/yearn-uptime-kuma-status reads is declared in its wrangler.toml —
# hostnames, a status-page slug, a cache TTL, and a KV namespace — so there is
# no <project>/prd to fetch. sync-secrets: false skips the app-config fetch
# and the `wrangler secret bulk` push. `project` is still required because
# <project>/cloudflare-deploy-configs holds this Worker's production token.
#
# The deploy identity for this repository needs read on
# uptime-kuma-status / cloudflare-deploy-configs only. Keep this production
# identity on its own Cloudflare-specific Doppler service account.

name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write
  # Requested by the reusable workflow's preview comment job, so even a
  # production-only caller must grant it.
  pull-requests: write

cache-mode: none

jobs:
  deploy:
    uses: yearn/yearn-gha/.github/workflows/cloudflare-deploy.yml@<approved-sha> # pin to the approved full commit SHA
    with:
      project: uptime-kuma-status
      sync-secrets: false
      identity-id: ${{ vars.DOPPLER_CF_PRODUCTION_IDENTITY_ID }}
